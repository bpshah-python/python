<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PythonHub — Learn Python Programming</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Mobile Top Bar -->
    <header class="topbar">
        <button class="menu-toggle" id="menu-toggle" aria-label="Toggle sidebar">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <rect y="2" width="18" height="2" rx="1" fill="currentColor"/>
                <rect y="8" width="18" height="2" rx="1" fill="currentColor"/>
                <rect y="14" width="18" height="2" rx="1" fill="currentColor"/>
            </svg>
        </button>
        <span class="topbar-logo">Python<span>Hub</span></span>
        <div class="topbar-right">
            <span class="level-badge" id="mobile-level-badge">Beginner</span>
        </div>
    </header>

    <!-- Sidebar Overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="app-shell">

        <!-- IDE-style Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-logo">Python<span>Hub</span></span>
            </div>

            <!-- Level Switcher -->
            <div class="level-switcher">
                <button class="level-btn active" data-level="beginner">Beginner</button>
                <button class="level-btn" data-level="intermediate">Intermediate</button>
                <button class="level-btn" data-level="advanced">Advanced</button>
            </div>

            <div class="explorer-label">
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                    <path d="M2 3h8M2 6h8M2 9h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
                EXPLORER
            </div>

            <ul id="program-list" class="program-list"></ul>
        </aside>

        <!-- Main Content -->
        <main class="main-panel">

            <div class="viewer-empty" id="viewer-empty">
                <div class="empty-icon">
                    <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                        <rect x="6" y="8" width="36" height="32" rx="4" stroke="#FFD43B" stroke-width="2"/>
                        <path d="M14 18h20M14 24h14M14 30h10" stroke="#FFD43B" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </div>
                <p>Select a program from the sidebar</p>
            </div>

            <div class="viewer" id="viewer" style="display:none">
                <div class="viewer-meta">
                    <div class="breadcrumb">
                        <span class="breadcrumb-level" id="breadcrumb-level">beginner</span>
                        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M4 2l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        <span class="breadcrumb-title" id="breadcrumb-title">—</span>
                    </div>
                    <button id="copy-btn" class="copy-btn">
                        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                            <rect x="4" y="4" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.3"/>
                            <path d="M2 10V2.5A.5.5 0 012.5 2H10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                        </svg>
                        Copy
                    </button>
                </div>

                <div class="program-info">
                    <h1 id="program-title" class="program-title"></h1>
                    <p id="program-desc" class="program-desc"></p>
                </div>

                <div class="code-wrap">
                    <div class="code-toolbar">
                        <span class="lang-tag">
                            <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                                <circle cx="6" cy="6" r="5" stroke="#FFD43B" stroke-width="1.3"/>
                                <path d="M4 4l4 2-4 2V4z" fill="#FFD43B"/>
                            </svg>
                            python
                        </span>
                        <div class="dot-cluster">
                            <span class="dot red"></span>
                            <span class="dot yellow"></span>
                            <span class="dot green"></span>
                        </div>
                    </div>
                    <div class="code-scroll">
                        <div class="line-numbers" id="line-numbers"></div>
                        <pre><code id="code-block" class="python-code"></code></pre>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
