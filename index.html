<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Hub - Learn Python Programming</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="container">
            <h1 class="logo">Python<span>Hub</span></h1>
            <nav class="nav-tabs">
                <button class="tab-btn active" data-level="beginner">Beginner</button>
                <button class="tab-btn" data-level="intermediate">Intermediate</button>
                <button class="tab-btn" data-level="advanced">Advanced</button>
            </nav>
        </div>
    </header>

    <main class="container content-wrapper">
        
        <aside class="sidebar">
            <h2 class="sidebar-title">Programs</h2>
            <ul id="program-list" class="program-list">
                </ul>
        </aside>

        <section class="code-viewer">
            <div class="viewer-header">
                <h2 id="program-title">Select a Program</h2>
                <button id="copy-btn" class="copy-btn">Copy Code</button>
            </div>
            <p id="program-desc" class="program-desc">Choose a program from the sidebar to view the logic and code structure.</p>
            <div class="code-container">
                <pre><code id="code-block" class="python-code"># Your code will appear here...</code></pre>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
